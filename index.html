<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a14"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Night Desk: a superhero dispatch management game.">
<title>Night Desk</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{--bg:#070a14;--panel:#0e1428;--panel2:#141c38;--line:#24305a;--txt:#d8e1ff;--dim:#8792b8;--cyan:#3ef0ff;--mag:#ff3ea5;--org:#ff9f1c;--grn:#4cd97b;--red:#ff4d5e;--yel:#ffd23f;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;position:fixed;inset:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;padding:var(--sat) var(--sar) var(--sab) var(--sal);display:flex;flex-direction:column}
#app.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
#game{flex:1;display:flex;flex-direction:column;min-height:0}
#top{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:linear-gradient(#0c1226,#090e1e);border-bottom:1px solid var(--line)}
.ib{min-width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;padding:0 8px}
.ib.on{border-color:var(--cyan);color:var(--cyan)}
.tclock{display:flex;flex-direction:column;align-items:center;line-height:1}
#clock{font:700 20px ui-monospace,Menlo,Consolas,monospace;color:var(--cyan);text-shadow:0 0 8px #3ef0ff88}
#shiftLbl{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
.tscore{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:48px}
.tscore small,#rankBox small{font-size:10px;color:var(--dim);letter-spacing:1px}
#scoreLbl{font:700 16px ui-monospace,monospace;color:var(--yel)}
#rankBox{flex:1;min-width:60px;display:flex;flex-direction:column;gap:3px}
#rankName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#1b2346;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--org));width:0}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#mapwrap{flex:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#radio{position:absolute;left:6px;bottom:6px;max-width:min(70%,420px);font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:#9effc0;background:#02060ccc;border:1px solid #1d3b2a;border-radius:8px;padding:4px 7px;pointer-events:none}
#radio div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#radio div:not(:last-child){opacity:.55}
#toasts{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92%,460px);pointer-events:none}
.toast{background:#101a3acc;border:1px solid var(--cyan);color:#e6fbff;border-radius:10px;padding:7px 12px;font-size:13px;text-align:center;box-shadow:0 0 14px #3ef0ff44;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#dbg{position:absolute;right:6px;top:6px;font:11px ui-monospace,monospace;background:#000c;color:#0f0;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre}
#pausedTag{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font:800 28px ui-monospace,monospace;letter-spacing:6px;color:#fff8;pointer-events:none}
#queue{flex:none;height:62px;display:flex;gap:6px;padding:5px 6px;overflow-x:auto;overflow-y:hidden;background:#080d1c;border-top:1px solid var(--line);touch-action:pan-x;scrollbar-width:none}
#queue::-webkit-scrollbar,#roster::-webkit-scrollbar{display:none}
.qi{flex:none;min-width:150px;max-width:190px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:7px;padding:4px 8px;text-align:left;position:relative;overflow:hidden}
.qi .qic{font-size:20px;width:26px;text-align:center}
.qi .qt{font-size:12px;font-weight:600;line-height:1.15;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qi .qb{position:absolute;left:0;bottom:0;height:3px;background:var(--grn)}
.qi.urgent{border-color:var(--red);animation:pulse 0.6s infinite alternate}
.qi.rev{border-color:var(--yel)}.qi.dis{border-color:var(--red);background:#2a0d18}
.qempty{color:var(--dim);font-size:12px;align-self:center;padding:0 8px}
@keyframes pulse{to{box-shadow:0 0 12px var(--red)}}
#roster{flex:none;height:118px;display:flex;gap:6px;padding:6px;overflow-x:auto;overflow-y:hidden;background:#0a0f20;border-top:1px solid var(--line);touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:none}
.hc{flex:none;width:84px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:5px 3px 4px;position:relative;scroll-snap-align:start}
.hc .por{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:26px;position:relative;background:#1a2244}
.hc .ring{position:absolute;inset:-4px;border-radius:50%;pointer-events:none}
.hc .nm{font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.hc .stt{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.hc .pb{width:70px;height:4px;border-radius:2px;background:#1b2346;margin-top:3px;overflow:hidden}.hc .pb i{display:block;height:100%;width:0;background:#4fb3ff}
.hc .badge{position:absolute;top:2px;right:4px;font-size:15px}
.hc .xpst{position:absolute;top:2px;left:4px;font-size:12px;color:var(--yel)}
.hc.injured .por{background:#4a2e0a;box-shadow:0 0 0 2px #ffb03a}
.hc.downed{filter:grayscale(1);opacity:.6}
.hc.await .por{box-shadow:0 0 0 3px var(--yel)}
.float{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:var(--yel);font-weight:800;font-size:14px;animation:floatup 1.8s forwards;pointer-events:none;text-shadow:0 0 6px #000}
@keyframes floatup{to{transform:translate(-50%,-38px);opacity:0}}
@media (orientation:landscape){
  #top{height:44px}.ib{height:36px}
  #main{flex-direction:row}
  #queue{height:auto;width:210px;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-top:0;border-left:1px solid var(--line);touch-action:pan-y}
  .qi{min-width:0;max-width:none;width:100%}
  #roster{height:94px}
  .hc{width:78px;padding-top:3px}.hc .por{width:40px;height:40px;font-size:21px}
}
/* screens & modals */
#screen{position:absolute;inset:0;padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);overflow-y:auto;touch-action:pan-y;background:radial-gradient(ellipse at top,#1a1240,#070a14 70%);z-index:5}
.scr{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.logo{font:900 clamp(38px,11vw,72px)/1 ui-monospace,Menlo,monospace;text-align:center;letter-spacing:4px;color:#fff;text-shadow:0 0 18px var(--mag),0 0 36px var(--mag);margin-top:4vh}
.logo span{color:var(--cyan);text-shadow:0 0 18px var(--cyan)}
.tag{text-align:center;color:var(--dim)}
.card{background:#0e1428e6;border:1px solid var(--line);border-radius:14px;padding:12px}
.card h3{margin:0 0 6px;font-size:16px;color:var(--cyan)}
.btn{min-height:50px;border-radius:12px;border:1px solid var(--cyan);background:linear-gradient(#173052,#0f2038);font-weight:800;letter-spacing:1px;padding:0 18px;color:#e9fdff}
.btn.pri{background:linear-gradient(#ff4fae,#c21a72);border-color:#ff8fd0}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{min-height:38px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.35}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:10px;padding:6px 8px;border:1px solid var(--line)}
.mini .e{font-size:24px}
.mini small{color:var(--dim);display:block;font-size:11px}
#modal{position:absolute;inset:0;z-index:10;background:#000a;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px)}
.sheet{width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#111a36,#0b1126);border:1px solid #33427a;border-radius:16px;box-shadow:0 0 40px #3ef0ff22;overflow:hidden}
.sh-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-h h2{margin:0;font-size:17px;flex:1;min-width:150px}
.sh-b{padding:10px 12px;overflow-y:auto;touch-action:pan-y;flex:1;min-height:0}
.sh-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
.sh-f .btn{flex:1}
.diff{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:1px}
.diff.easy{background:#123d24;color:#7ff0a8}.diff.normal{background:#3d2e10;color:#ffcf70}.diff.hard{background:#47121c;color:#ff8a99}
.pill{font-size:12px;color:var(--dim);background:#0a1024;border:1px solid var(--line);border-radius:20px;padding:2px 8px;white-space:nowrap}
.kw{font-weight:800;padding:0 2px;border-radius:3px}
.txt{margin:0 0 8px;font-size:15px}
.note{font-size:13px;padding:6px 8px;border-radius:8px;background:#0a1024;border-left:3px solid var(--cyan);margin:4px 0}
.note.warn{border-color:var(--red)}.note.good{border-color:var(--grn)}.note.req{border-color:var(--yel)}
.bgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px) and (orientation:landscape){.bgrid{grid-template-columns:1.2fr 1fr}}
.slots{display:flex;gap:8px;margin:6px 0}
.slot{flex:1;min-width:0;min-height:78px;border:2px dashed #3a4a85;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--dim);position:relative;background:#0a1024;padding:4px}
.slot.sel{border-color:var(--cyan);box-shadow:0 0 10px #3ef0ff66}
.slot.full{border-style:solid;border-color:var(--org);color:var(--txt)}
.slot .e{font-size:28px;line-height:1}
.slot .n{font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .x{position:absolute;top:2px;right:6px;font-size:14px;color:var(--dim)}
.slot.lock .x{display:none}
.slot.drop{border-color:var(--grn)}
.links{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.chip{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;touch-action:none}
.chip .e{font-size:24px}.chip .n{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}.chip small{font-size:9px;color:var(--dim);text-transform:uppercase}
.chip.used{opacity:.35}.chip:disabled{opacity:.3}
.chip.req{border-color:var(--yel)}
.ghostdrag{position:fixed;z-index:50;pointer-events:none;font-size:34px;transform:translate(-50%,-50%)}
.radarbox{display:flex;flex-direction:column;align-items:center}
.radarbox canvas{width:200px;height:200px;flex:none}
.statrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font:12px ui-monospace,monospace}
.statrow span{padding:1px 5px;border-radius:5px;background:#0a1024}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:600}
.opt .st{font-size:11px;font-weight:800;padding:2px 6px;border-radius:5px;color:#000}
.opt.hero{border-color:var(--yel);background:#2a2610}
.opt.on{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan) inset}
.quip{font:13px ui-monospace,monospace;color:#9effc0;margin:4px 0}
.result{font:800 30px ui-monospace,monospace;text-align:center;letter-spacing:3px;margin:6px 0}
.result.ok{color:var(--grn);text-shadow:0 0 14px var(--grn)}.result.bad{color:var(--red);text-shadow:0 0 14px var(--red)}
.revcv{width:min(78vw,300px);height:min(78vw,300px);display:block;margin:0 auto}
@media (orientation:landscape){.revcv{width:min(52vh,260px);height:min(52vh,260px)}}
.dbgbox{font:11px ui-monospace,monospace;color:#0f0;background:#000;border-radius:6px;padding:4px 6px;white-space:pre-wrap;margin-top:6px}
table.sum{width:100%;border-collapse:collapse;font-size:15px}table.sum td{padding:5px 4px;border-bottom:1px solid var(--line)}table.sum td:last-child{text-align:right;font-weight:800;font-family:ui-monospace,monospace}
.grade{font:900 84px/1 ui-monospace,monospace;text-align:center}
.grade.S{color:var(--yel);text-shadow:0 0 30px var(--yel)}.grade.A{color:var(--grn)}.grade.B{color:var(--cyan)}.grade.C{color:var(--org)}.grade.D{color:var(--red)}
.email{font:13px/1.45 ui-monospace,monospace;background:#05080f;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap}
.alloc{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}
.sbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sbtns button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:#0a1024;font:700 12px ui-monospace,monospace;padding:2px}
.sbtns button b{display:block;font-size:15px}
.tglrow{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--line)}
.tgl{width:58px;height:32px;border-radius:16px;border:1px solid var(--line);background:#1b2346;position:relative}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#7a86b0;transition:.2s}
.tgl.on{background:#0e4a55;border-color:var(--cyan)}.tgl.on::after{left:29px;background:var(--cyan)}
input.seed{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0a1024;color:var(--txt);padding:0 10px;font:16px ui-monospace,monospace;width:100%;-webkit-user-select:text;user-select:text}
/* hack */
#hack{position:absolute;inset:0;z-index:20;background:#03050c;display:flex;flex-direction:column;padding:calc(var(--sat) + 4px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);gap:5px}
.hhead{display:flex;gap:8px;align-items:center}
.htitle{font:800 14px ui-monospace,monospace;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.htimer{flex:1;height:12px;border-radius:6px;background:#1b2346;overflow:hidden}.htimer i{display:block;height:100%;background:linear-gradient(90deg,#ff7b00,#ffb03a);width:100%}
.hmsg{font:13px ui-monospace,monospace;color:#9effc0;display:flex;justify-content:space-between;gap:6px;min-height:18px}
#hKey{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;font:800 20px ui-monospace,monospace;text-align:center;color:var(--yel);background:#2a2610;border-radius:8px;padding:4px}
.hstage{flex:1;position:relative;min-height:0}
#hcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hSeq,#hPad{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:#0b1430f2;border:1px solid var(--cyan);border-radius:12px;padding:8px 10px;text-align:center;max-width:96%}
#hSeq .arrows{font:800 26px ui-monospace,monospace;letter-spacing:4px}
#hSeq .arrows b{color:var(--grn)}
#hPad .disp{font:800 26px ui-monospace,monospace;letter-spacing:8px;margin-bottom:6px;color:var(--yel)}
#hPad .keys{display:grid;grid-template-columns:repeat(4,58px);gap:6px}
#hPad .keys button{height:50px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:800 20px ui-monospace,monospace}
.hctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
.dpad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,56px);gap:4px}
.dp{border-radius:12px;border:1px solid #2c3b70;background:#121b3a;font-size:22px}
.dp:active,.dp.press{background:#1f3570}
.dp.up{grid-column:2;grid-row:1}.dp.left{grid-column:1;grid-row:2}.dp.right{grid-column:3;grid-row:2}.dp.down{grid-column:2;grid-row:3}
.hbtns{display:flex;flex-direction:column;gap:10px}
.btn.act{min-width:110px;min-height:64px;font-size:18px}
.btn.hold{min-width:110px;min-height:64px;font-size:18px;border-color:var(--grn);background:linear-gradient(#174a2a,#0d2a18)}
@media (orientation:landscape){#hack{display:grid;grid-template-columns:200px 1fr 150px;grid-template-rows:auto auto 1fr;}
  .hhead{grid-column:1/4}.hmsg{grid-column:1/4}.hstage{grid-column:2;grid-row:3}
  .hctrl{display:contents}.dpad{grid-column:1;grid-row:3;align-self:center}.hbtns{grid-column:3;grid-row:3;align-self:center}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.help li{margin-bottom:4px}
@media (orientation:landscape) and (max-height:520px){.radarbox canvas{width:150px;height:150px}.slot{min-height:64px}.sh-h{padding:6px 10px}.sh-f .btn{min-height:44px}#radio{max-width:45%;font-size:11px}}

/* ---- leveling v2 ---- */
.hc .lv{position:absolute;top:3px;left:4px;font:800 9px ui-monospace,monospace;background:#1b2346;color:#cfe;border-radius:5px;padding:1px 4px;letter-spacing:.3px}
.hc .lv.max{background:#5a4510;color:#ffd23f}
.hc .xpb,.xpbar{width:70px;height:4px;border-radius:2px;background:#1b2346;margin-top:2px;overflow:hidden}
.hc .xpb i,.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#3ef0ff);transition:width .6s}
.hc .xpb.max i,.xpbar.max i{background:linear-gradient(90deg,#ffb03a,#ffd23f)}
.spc{position:absolute;right:-8px;bottom:-4px;font:800 10px ui-monospace,monospace;background:var(--yel);color:#000;border-radius:8px;padding:1px 4px;animation:sppulse 1s infinite alternate}
@keyframes sppulse{to{box-shadow:0 0 10px var(--yel);transform:scale(1.12)}}
#lvlBanner{position:fixed;top:calc(var(--sat) + 60px);left:50%;transform:translateX(-50%);z-index:45;background:#1a1440f2;border:2px solid var(--yel);border-radius:14px;padding:10px 16px;font:800 15px ui-monospace,monospace;color:#fff;text-align:center;max-width:92vw;box-shadow:0 0 30px #ffd23f88;pointer-events:none}
#lvlBanner.pop{animation:lvpop .5s}
@keyframes lvpop{0%{transform:translateX(-50%) scale(.4);opacity:0}70%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
.xprow{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin:4px 0;font-size:13px}
.xprow .xpbar{width:100%;height:7px}
.xprow small{grid-column:1/4;color:var(--dim);font:11px ui-monospace,monospace;margin-top:-2px}
.xpest{font:10px ui-monospace,monospace;color:var(--yel)}
.al-row{display:grid;grid-template-columns:1fr 46px 34px 46px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.al-row button{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:800 20px ui-monospace,monospace}
.al-row b{font:800 18px ui-monospace,monospace;text-align:center}
.al-row.capped{opacity:.4}
.al-row small{display:block;color:var(--dim);font-size:11px}

function rewardText(r) { return ({ medkit: ['🩹 Med Kit', 'Heal 1 injury per shift (Tools).'], jump: ['⚡ Jump Start', 'Revive a downed hero once per shift (Tools).'], wildcard: ['🎲 Wildcard stat', 'A random stat is rolled; you choose which hero present gets +1. Must be assigned right away.'],

function wildSpin(box, stat, cb) {

let lastT = performance.now(), lastDom = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  try {
    if (UI.screen === 'game' && UI.S) {
      const S = UI.S;
      if (!isPaused()) {
        tick(UI.camp, S, dt * S.speed);
        if (UI.auto) { UI.autoAcc += dt * S.speed; if (UI.autoAcc >= CONFIG.autoReviewDelay) { UI.autoAcc = 0; aiStep(UI.camp, S, {}); } }
        for (const c of S.calls) if (c.stage === 'pending') { const rem = c.expiresAt - S.t; if (rem <= CONFIG.alarmSeconds) { const k = Math.ceil(rem); if (c._al !== k) { c._al = k; Sfx.alarm(); } } }
      }
      drawMap(now / 1000);
      if (now - lastDom > 100) { lastDom = now; updateRoster(); updateQueue(); updateTop(); }
      Sfx.musicUpdate(pendingCalls(S).length, !isPaused());
      if (UI.shiftOverPending && !UI.modals.length && !UI.hack) { UI.shiftOverPending = false; showSummary(); }
      else if (UI.shiftOverPending && UI.modals.length && UI.modals[0].kind !== 'review' && UI.modals[0].kind !== 'levelup') { closeModal(); }
    }
    if (UI.hack) hackFrame(dt);
    FX.update(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
