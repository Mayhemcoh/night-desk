<style>:root{--bg:#070a14;--panel:#0e1428;--panel2:#141c38;--line:#24305a;--txt:#d8e1ff;--dim:#8792b8;--cyan:#3ef0ff;--mag:#ff3ea5;--org:#ff9f1c;--grn:#4cd97b;--red:#ff4d5e;--yel:#ffd23f;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;position:fixed;inset:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;padding:var(--sat) var(--sar) var(--sab) var(--sal);display:flex;flex-direction:column}
#app.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
#game{flex:1;display:flex;flex-direction:column;min-height:0}
#top{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:linear-gradient(#0c1226,#090e1e);border-bottom:1px solid var(--line)}
.ib{min-width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;padding:0 8px}
.ib.on{border-color:var(--cyan);color:var(--cyan)}
.tclock{display:flex;flex-direction:column;align-items:center;line-height:1}
#clock{font:700 20px ui-monospace,Menlo,Consolas,monospace;color:var(--cyan);text-shadow:0 0 8px #3ef0ff88}
#shiftLbl{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
.tscore{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:48px}
.tscore small,#rankBox small{font-size:10px;color:var(--dim);letter-spacing:1px}
#scoreLbl{font:700 16px ui-monospace,monospace;color:var(--yel)}
#rankBox{flex:1;min-width:60px;display:flex;flex-direction:column;gap:3px}
#rankName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#1b2346;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mag),var(--org));width:0}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#mapwrap{flex:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

@media (max-height:500px) and (orientation:landscape){.hero-overlay{padding:4px calc(var(--sar) + 6px) 4px calc(var(--sal) + 6px)}.hinfo{width:22px;height:22px;font-size:12px}}
/* v1.9.5 band explanation */
.bands{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font:600 11px ui-monospace,monospace;margin:4px 0 6px}
.bands i{opacity:.6;font-style:normal}.band{padding:2px 6px;border-radius:6px;border:1px solid #2c3a66;background:#141c36}
.band.b0{color:#4cd97b;border-color:#4cd97b}.band.up{color:#7ee2a8}.band.dn{color:#ff8a96}.band.tot{color:#fff;border-color:#fff}
.bandnote{text-align:center;font-size:12px;color:#ffd23f;margin-bottom:4px}
/* v1.10 powers */
.ch-retry{font-size:12.5px;color:#9fd3ff;margin:4px 0 0;padding:3px 6px;border-left:3px solid #4aa3ff;background:rgba(74,163,255,.08);border-radius:4px}
.ch-retry.used{color:var(--dim);border-left-color:#666;background:none}
.pw.unrevealed b{letter-spacing:2px;color:var(--dim)}
.mk2btn{display:block;margin-top:6px;font-size:12px;padding:6px 8px;width:100%}
.illusion-note.warn{border-color:#ffb020}
.rolllabel{font-size:13px}
.bandnote.reroll{color:#9fd3ff}
/* v1.10.1 contrast: theme tokens for boxes that used hard-coded dark backgrounds. Every background sets its text colour too. */
:root{--box-dark:#0a1024;--box-dark-txt:#d8e1ff;--box-dark-dim:#a3aed4;--box-dark2:#101831;--box-warm:#2a2610;--box-dis:#2a0d18;--email-bg:#05080f;--email-txt:#d8e1ff;--yel-txt:var(--yel);--btn-dis-bg:#151c33;--btn-dis-txt:#9aa6cf;--btn-dis-line:#56628f;--muted-txt:#a3aed4}
.pw{background:var(--box-dark);color:var(--box-dark-txt)}.pw small,.pw .pill{color:var(--box-dark-dim)}.pw .pill{background:var(--box-dark)}
.pw.locked{opacity:1;color:var(--muted-txt);border-color:#555}.pw.out{opacity:1;color:var(--muted-txt);border-color:#555;text-decoration:line-through}
.pw.locked b,.pw.locked small,.pw.locked .pill,.pw.out b,.pw.out small,.pw.out .pill{color:var(--muted-txt)!important}
.email{background:var(--email-bg);color:var(--email-txt)}
.thr span{background:var(--box-dark);color:var(--box-dark-dim)}.thr span.on{background:var(--box-warm);color:var(--yel-txt)}
.cx-cover div{background:var(--box-dark2);color:var(--box-dark-txt)}.cx-cover b{color:var(--c-ink,var(--c))}.cx-cover small{color:var(--box-dark-dim)}
.cx-top b{color:var(--hc-ink,var(--hc))}.wc-chip{color:var(--c-ink,var(--c))}.wc-chip.hl{color:#111}
.pfx-banner{background:var(--box-warm);color:var(--box-dark-txt)}
.qi.dis{background:var(--box-dis);color:var(--box-dark-txt)}
.float,.xpest{color:var(--yel-txt)}
.sel-slot.empty{opacity:1}
.chip.used,.chip:disabled{opacity:1;filter:grayscale(.85);border-style:dashed}.chip.used .n,.chip.used small,.chip:disabled .n,.chip:disabled small{color:var(--muted-txt)!important}
html body .btn.btn:disabled{opacity:1;background:var(--btn-dis-bg)!important;color:var(--btn-dis-txt)!important;border:1px dashed var(--btn-dis-line)!important;box-shadow:none!important;text-shadow:none!important}
.btn.pri{background:linear-gradient(#d61f7f,#a3155f)}

<script>window.ND_STANDALONE=true;
'use strict';
/* ================= NIGHT DESK : CONFIG (every tunable number lives here) ================= */
const CONFIG = {
  shiftSeconds: 360,        // real seconds per shift at 1x (20:00 -> 02:00)
  startHour: 20, shiftHours: 6,
  speeds: [1, 2],
  spawnFirst: 3,            // first call after N seconds
  spawnBase: 15,            // seconds between calls in shift 1
  spawnPerShift: -1.1,      // change per shift index
  spawnMin: 7,              // floor of spawn interval
  spawnJitter: 0.35,        // +-35% randomness
  spawnStopAt: 325,         // no new calls after this time
  maxPending: 7,            // never more than this many unanswered pins
  denseShiftSpawnMult: 0.8, // shift 7 "dense calls" multiplier
  expiry: { easy: 30, normal: 25, hard: 20 },
  expiryShiftMult: 0.85,    // per shift after shift 3
  expiryAfterShift: 3,
  expiryMin: 14,            // floor so late shifts stay humane
  alarmSeconds: 5,          // ticking alarm + red pulse
  hackExpiry: 45, blackoutHackExpiry: 50,
  heroSpeed: 130,           // map units per second (map is 1280x720 units)
  travelMin: 3, travelMax: 8,
  soloMult: 0.6,            // Solo Act travel+work multiplier
  shortTravelMult: 0.7,     // travel powers
  restBase: 10, restPerDiff: 2, // rest = base + perDiff * (0 easy,1 normal,2 hard)
  coverageMode: 'area',     // 'perStat' or 'area' (true polygon intersection area)
  coverageExponent: 1,     // v1.9.5 Dispatch parity: chance = covered area (was perStat^1.5)
  streakAbove: 0.76, streakUses: 3, chanceFloor: 0.15, helpersOffFromIdx: 7, // v1.9.5 hidden helpers; off from Shift 8 (idx 7)
  hardCap: 0.85, normalCap: 1.0, easyCap: 1.0,
  synergyBase: 0.05, synergyPerPairing: 0.02, synergyMax: 0.15,
  moraleChance: 0.05, conflictPenalty: 0.08, conflictNeutralWins: 3,
  conflictsFromShift: 4,
  injuryOnFail: { easy: 0, normal: 0.2, hard: 0.5 },
  injuryRiskyCompeting: 0.35,
  // v1.8 mission set
  deckJitter: 0.2, followUpDelay: 3, bossRespawn: 20, finaleCityHit: 8, finaleCityFollowUp: 4, sabotageTimer: 12, routeMult: 0.85, routeMax: 3,
  disruptionChance: 0.25, disruptionTimer: 12, disruptionAt: 0.4, disruptionsFromShift: 3,
  allowAllocUndo: false,    // v1.2: confirmed stat points are final (like the source game); UNDO only clears unconfirmed picks
  disruptRoundXP: [1, 0.75, 0.5], disruptHackTimeBonus: 2, // v1.8.1
  perfectXpBonus: 0.33,     // +33% XP to the hero on a perfect pick (one guide's estimate)
  bonusXpMult: 2,
  baseXP: { easy: 216, normal: 336, hard: 552 }, // tuned with simtest (offsets the veteran taper below)
  // ---- Leveling (v2) ----
  xpRiskWeight: 0.25,       // DESIGN: riskMult = 1 + w*(1-chance); riskier sends earn more XP
  xpShiftScale: -0.06,      // DESIGN: per-shift pool multiplier (1 + scale*shiftIdx); tuned slightly negative so later, denser shifts don't max everyone early
  levelCap: 10,             // LV = 1 + XP points earned; 10 = all 9 points
  trainLevel: 3,            // v1.10: LV at which a hero may train (pick 1 of 2, exclusive), AND the base power must be revealed (Dispatch parity)
  signatureLevel: 8,        // v1.10: LV at which a hero who has trained MAY upgrade the base power to Mk II (explicit choice, never automatic)
  slotBonusMinSlots: 3,     // v1.10: slot-bonus powers only work on calls with 3+ slots (Dispatch: En Pointe / Diamond in the Rough)
  extendExpirySeconds: 8, extendExpiryAt: 5, // v1.10 Head Time Mk II: once per shift, +8 s on a call about to expire
  trainingSlotsPerSession: 2, // heroes that may train per training session
  poolMinStatTotal: 14,     // v1.3: each stat summed over a drawn 8 must reach this
  maxWildcards: 4,          // wildcard (random-stat) points from promotions over a whole campaign
  xpLevelTaper: 0.145,       // DESIGN: veteran taper, share x(1 - taper*(LV-1)); slows the late levels
  xpTaperFloor: 0.2,        // DESIGN: the taper never cuts a share below this fraction
  xpLogMax: 10,             // recent XP entries kept per hero
  lateJoinXPPerShift: 900,  // DESIGN: heroes hired after shift 1 arrive with this much XP per shift they missed
  xpFirstPoint: 1000, xpPointStep: 300, xpMaxPoints: 9,
  statMax: 10, teamCap: 10,
  score: { success: 100, fail: -40, missed: -60, perfect: 25, hack: 50 },
  // grade = score / (calls that came in this shift * 100) thresholds
  grades: [['S', 0.80], ['A', 0.62], ['B', 0.44], ['C', 0.25], ['D', -99]],
  gradePoints: { S: 4, A: 3, B: 2, C: 1, D: 0 },
  gradeRankBonus: { S: 5, A: 3, B: 1, C: 0, D: 0 },
  rankThresholds: [0, 10, 24, 42, 64, 90, 120, 155, 195], // rank points (successes + grade bonus)
  rankNames: ['Night Temp', 'Desk Jockey', 'Line Dispatcher', 'Senior Dispatcher', 'Shift Lead', 'Watch Captain', 'Night Chief', 'Director of Nights', 'Legend of the Desk'],
  medKitRank: 2, jumpStartRank: 4,   // fallbacks only; v1.4 reads CONFIG.rankRewards

  rankRewards: [null, null, 'medkit', 'wildcard', 'jump', 'wildcard', 'hacktime', 'wildcard', 'wildcard', 'title'],

/* v1.10: every power declares where it acts: stat (pentagon -> coverage -> %), cap (acts on the roll itself: re-roll), time (travel/work/expiry),
   rest, xp, injury, info. Explicit `kind` wins; otherwise it is derived from the hooks so a new power can never be left without one. */
const POWER_KINDS = ['stat', 'cap', 'time', 'rest', 'xp', 'injury', 'info'];
function powerKindOf(P) { if (P.kind) return P.kind; if (P.onCompute || P.smallTeam || P.aura || P.illusion || P.spread || P.swap || P.supernova) return 'stat'; if (P.retry) return 'cap';
  if (P.travelMult || P.solo || P.extendExpiry) return 'time'; if (P.restMult) return 'rest'; if (P.xpBoost || P.soloXpBoost) return 'xp'; if (P.heal || P.immune || P.noDown || P.ignoreInjury || P.injuryShield || P.immuneOnSuccess) return 'injury'; if (P.preview) return 'info'; return 'info'; }
for (const k in POWERS) POWERS[k].kind = powerKindOf(POWERS[k]);
const RETIRED_POWERS = { encore: 'perfectcopy', shortcircuit: 'comet', sparksight: 'supernova', foundation: 'spreadthin', digin: 'foundhimself', shadowstep: 'wolfpack', casejoint: 'eartoground' }; // v1.10 save migration

/* ---------- main loop ---------- */
let lastT = performance.now(), lastDom = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  try {
    if (UI.screen === 'game' && UI.S) {
      const S = UI.S;
      if (!isPaused()) {
        tick(UI.camp, S, dt * S.speed);
        if (UI.auto) { UI.autoAcc += dt * S.speed; if (UI.autoAcc >= CONFIG.autoReviewDelay) { UI.autoAcc = 0; aiStep(UI.camp, S, {}); } }
        for (const c of S.calls) if (c.stage === 'pending') { const rem = c.expiresAt - S.t; if (rem <= CONFIG.alarmSeconds) { const k = Math.ceil(rem); if (c._al !== k) { c._al = k; Sfx.alarm(); } } }
      }
      drawMap(now / 1000);
      if (now - lastDom > 100) { lastDom = now; updateRoster(); updateQueue(); updateTop(); }
      Sfx.musicUpdate(pendingCalls(S).length, !isPaused());
      if (UI.shiftOverPending && !UI.modals.length && !UI.hack) { UI.shiftOverPending = false; showSummary(); }
      else if (UI.shiftOverPending && UI.modals.length && UI.modals[0].kind !== 'review' && UI.modals[0].kind !== 'levelup') { closeModal(); }
    }
    if (UI.hack) hackFrame(dt);
    FX.update(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

    if (UI.hack) { const g = UI.hack.game; const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
      if (map[k]) { e.preventDefault(); hackStep(map[k]); } else if (k === 'e' || k === 'E') { g.act(); renderHackPanels(); } else if (k === ' ') { e.preventDefault(); g.holding = true; } else if (g.mode === 'lock' && /^[0-9]$/.test(k)) { g.lockKey(k); renderHackPanels(); } else if (g.mode === 'lock' && k === 'Enter') { g.lockKey('OK'); hackFx(); renderHackPanels(); } else if (k === 'Escape') { if (g.mode) { g.cancelMode(); renderHackPanels(); } } return; }

    const lm = UI.modals[0]; if (lm && lm.kind === 'levelup') { if (k === 'Escape') lm.esc(); else if (/^[1-5]$/.test(k)) lm.keyHero(+k - 1); else if (k === 'Enter') { e.preventDefault(); lm.enter(); } return; }
    if (UI.screen !== 'game') return;
    const m = UI.modals[0];

    if ((k === 's' || k === 'S' || k === 'ArrowLeft' || k === 'ArrowRight') && m && m.kind === 'briefing' && m.switchPair) { e.preventDefault(); m.switchPair(); return; } // v1.9.3
    if (/^[1-9]$/.test(k) && m && m.keyHero) { m.keyHero(+k - 1); return; }
